<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Countdown to Wednesday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #16150f;
    --muted: #8a877c;
    --line: rgba(22, 21, 15, .12);
    --land: #ebe8df;
    --land-line: rgba(22, 21, 15, .16);
    --card: rgba(255, 255, 255, .45);
    --glow-a: rgba(255, 190, 140, .45);
    --glow-b: rgba(160, 190, 255, .38);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0c;
      --ink: #f1efe8;
      --muted: #77746b;
      --line: rgba(241, 239, 232, .12);
      --land: #1a1a17;
      --land-line: rgba(241, 239, 232, .14);
      --card: rgba(255, 255, 255, .025);
      --glow-a: rgba(255, 150, 90, .16);
      --glow-b: rgba(100, 130, 255, .16);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .hero { padding: clamp(3rem, 12vh, 7rem) 0 clamp(2rem, 5vh, 3rem); display: grid; place-items: center; position: relative; z-index: 1; }

  /* soft drifting light */
  .glow { position: fixed; inset: 0; pointer-events: none; filter: blur(80px); }
  .glow i {
    position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
    animation: drift 28s ease-in-out infinite alternate;
  }
  .glow i:nth-child(1) { background: var(--glow-a); top: -20vmax; left: -15vmax; }
  .glow i:nth-child(2) { background: var(--glow-b); bottom: -25vmax; right: -15vmax; animation-delay: -14s; }
  @keyframes drift { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.1); } }

  /* fine grain */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  main { position: relative; z-index: 1; text-align: center; padding: 2rem 1.25rem; width: min(100%, 60rem); }

  .eyebrow {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: .72rem; font-weight: 300; letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted);
    opacity: 0; animation: rise 1.2s .1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .eyebrow::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: .9em; vertical-align: .08em;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .2; } }

  .clock {
    display: flex; justify-content: center; align-items: flex-start;
    gap: clamp(.4rem, 2.5vw, 1.6rem);
    margin: clamp(2rem, 6vh, 3.5rem) 0;
    font-family: "Instrument Serif", "Times New Roman", serif;
    font-size: clamp(3.6rem, 15.5vw, 11rem);
    line-height: 1; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    opacity: 0; animation: rise 1.4s .25s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .unit { display: flex; flex-direction: column; align-items: center; gap: clamp(.8rem, 2vw, 1.4rem); min-width: 1.15em; }
  .unit b { font-weight: 400; }
  .unit small {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: clamp(.55rem, 1.1vw, .7rem); font-weight: 300; letter-spacing: .28em;
    text-transform: uppercase; color: var(--muted); letter-spacing: .3em;
  }
  .sep { color: var(--muted); font-style: italic; opacity: .5; transform: translateY(-.06em); }

  .progress { width: min(22rem, 70%); height: 1px; margin: 0 auto; background: var(--line); position: relative; overflow: hidden;
    opacity: 0; animation: rise 1.4s .4s cubic-bezier(.2,.7,.2,1) forwards; }
  .progress span { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(0); transition: transform 1s linear; }


  .done { display: none; font-family: "Instrument Serif", serif; font-size: clamp(3rem, 12vw, 8rem); letter-spacing: -.03em; }
  .finished .clock, .finished .progress { display: none; }
  .finished .done { display: block; margin: 2.5rem 0; }


  /* ——— map ——— */
  .route { position: relative; z-index: 1; padding: 0 1.25rem clamp(3rem, 8vh, 5rem); display: grid; justify-items: center; }
  .map {
    position: relative; width: min(100%, 62rem); aspect-ratio: 1023 / 740; overflow: hidden;
    border: 1px solid var(--line); border-radius: 1.25rem; background: var(--card);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 30px 60px -30px rgba(0,0,0,.18);
  }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .map .land { fill: var(--land); stroke: var(--land-line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .map .link { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .7; }
  .pin { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
  .pin::before { content: ""; display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line); }
  .pin span { position: absolute; left: 50%; top: 100%; margin-top: .7rem; transform: translateX(-50%); white-space: nowrap;
    font-family: "Instrument Serif", serif; font-style: italic; font-size: 1.2rem; }
  .pin.minor::before { width: 4px; height: 4px; background: var(--muted); box-shadow: none; }
  .pin.minor span { font: 300 .62rem "Geist Mono", ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; font-style: normal; color: var(--muted); margin-top: .5rem; }
  .bus { position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--ink); color: var(--bg); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--line), 0 8px 18px -6px rgba(0,0,0,.35); pointer-events: none; }
  .bus svg { position: static; width: 18px; height: 18px; }
  .pin.has-bus span { margin-top: 1.5rem; }
  .inset { position: absolute; left: 1rem; bottom: 1rem; width: clamp(84px, 19%, 170px); padding: .5rem; background: var(--bg); border: 1px solid var(--line); border-radius: .75rem; }
  .inset svg { position: static; height: auto; }
  .inset .land { fill: var(--muted); fill-opacity: .45; stroke: none; }
  .inset .frame { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .map-caption { margin-top: 1rem; font: 300 .68rem "Geist Mono", ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .map-caption a { color: inherit; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
  @media (max-width: 520px) {
    .clock { flex-wrap: wrap; row-gap: 1.6rem; font-size: clamp(3.6rem, 22vw, 6rem); }
    .sep { display: none; }
    .unit { min-width: 42%; }
  }
</style>
</head>

  <div class="glow" aria-hidden="true"><i></i><i></i></div>
  <div class="hero">
  <main>
    <p class="eyebrow">Time remaining</p>

    <div class="clock" role="timer" aria-live="off" aria-label="Countdown">

      <div class="unit"><b id="h">00</b><small>Hours</small></div><span class="sep">:</span>
      <div class="unit"><b id="m">00</b><small>Minutes</small></div><span class="sep">:</span>
      <div class="unit"><b id="s">00</b><small>Seconds</small></div>
    </div>
    <div class="done">It’s <em>time</em>.</div>

    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  </main>
  </div>

<script>
  // Wednesday 30 Sep 2026, 12:00 Danish time (Europe/Copenhagen, CEST = UTC+2 on that date).
  // The offset is resolved via Intl so it stays correct regardless of the viewer's timezone.
  const TZ = "Europe/Copenhagen";
  function zonedToUtc(y, mo, d, h, mi) {
    const guess = Date.UTC(y, mo - 1, d, h, mi);
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric"
    }).formatToParts(new Date(guess)).reduce((a, p) => (a[p.type] = +p.value, a), {});
    const asLocal = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute);
    return guess - (asLocal - guess);
  }

  const target = zonedToUtc(2026, 9, 30, 12, 0);
  const start = zonedToUtc(2026, 9, 28, 8, 0); // progress bar runs from Monday 08:00 Danish time
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  function tick() {
    const now = Date.now();
    const left = Math.max(0, target - now);
    const t = Math.floor(left / 1000);
    $("d").textContent = pad(Math.floor(t / 86400));
    $("h").textContent = pad(Math.floor(t % 86400 / 3600));
    $("m").textContent = pad(Math.floor(t % 3600 / 60));
    $("s").textContent = pad(t % 60);
    $("bar").style.transform = `scaleX(${Math.min(1, Math.max(0, (now - start) / (target - start)))})`;
    document.body.classList.toggle("finished", left === 0);
    document.title = left ? `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)} · Countdown` : "It’s time";
  }
  tick();
  setInterval(tick, 250);

  // ——— map ———
  // Projection used to build the paths (see tools/build-map.mjs): x = lon·cos(56°)·K, y = −lat·K.
  const MAP = { K: 1000, cos: 0.5591929034707468, win: [4557,-56720,1023,740] };
  const project = (lon, lat) => [(lon * MAP.cos * MAP.K - MAP.win[0]) / MAP.win[2], (-lat * MAP.K - MAP.win[1]) / MAP.win[3]];
  const mapEl = $("map"), pins = $("pins");

  // Place any element on the map by lon/lat (percent-based, so it stays put when the map resizes).
  function place(el, lon, lat) {
    const [x, y] = project(lon, lat);
    el.style.left = x * 100 + "%"; el.style.top = y * 100 + "%";
    return el;
  }
  function addPin(name, lon, lat, minor) {
    const el = document.createElement("div");
    el.className = "pin" + (minor ? " minor" : "");
    el.innerHTML = "<span>" + name + "</span>";
    pins.appendChild(el);
    return place(el, lon, lat);
  }
  const CITIES = {
    struer:    [8.5917, 56.4917],
    silkeborg: [9.5451, 56.1697],
  };
  [["Holstebro", 8.6165, 56.3603], ["Viborg", 9.4020, 56.4532], ["Herning", 8.9730, 56.1394]]
    .forEach(([n, lon, lat]) => addPin(n, lon, lat, true));
  addPin("Struer", ...CITIES.struer);
  addPin("Silkeborg", ...CITIES.silkeborg).classList.add("has-bus");

  // Bus icon, currently at Silkeborg. Move it with place(bus, lon, lat).
  const bus = document.createElement("div");
  bus.className = "bus";
  bus.setAttribute("role", "img"); bus.setAttribute("aria-label", "Bus");
  bus.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>'; // Lucide "bus" (ISC licence)
  pins.appendChild(bus);
  place(bus, ...CITIES.silkeborg);

  // Dashed line between the two cities (in viewBox units)
  (() => {
    const [a, b] = [CITIES.struer, CITIES.silkeborg].map(([lon, lat]) => project(lon, lat));
    const w = MAP.win;
    $("link").setAttribute("d", `M${w[0] + a[0] * w[2]} ${w[1] + a[1] * w[3]}L${w[0] + b[0] * w[2]} ${w[1] + b[1] * w[3]}`);
  })();

  // Handle for the moving object later: window.dkMap.place(el, lon, lat)
  window.dkMap = { project, place, addPin, bus, cities: CITIES, el: mapEl, pins };
